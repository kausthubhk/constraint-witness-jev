[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "contract-eval"
version = "0.1.0"
description = "Prefix-pure harness for explicit coding-constraint evaluation."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["mypy>=1.15,<2", "pytest>=8", "ruff>=0.8"]

[project.scripts]
contract-eval = "contract_eval.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
