name: CI

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development dependencies
        run: python -m pip install --requirement requirements-dev.lock
      - name: Install package without dependency resolution
        run: python -m pip install --no-deps --editable .
      - name: Lint
        run: python -m ruff check src tests
      - name: Check formatting
        run: python -m ruff format --check src tests
      - name: Static type check
        run: python -m mypy src/contract_eval --ignore-missing-imports
      - name: Test
        run: python -m pytest
      - name: Check generated JSON Schema exports
        run: python -m contract_eval.schema_export --check
      - name: Validate synthetic fixtures
        run: python -m contract_eval validate fixtures/synthetic
      - name: Validate heldout fixtures
        run: python -m contract_eval validate fixtures/heldout
      - name: Validate semantic development fixtures
        run: python -m contract_eval validate fixtures/semantic-development-v1
